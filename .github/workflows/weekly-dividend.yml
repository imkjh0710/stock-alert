name: Daily Dividend Report

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 평일 매일 13:00 UTC = 22:00 KST
  workflow_dispatch:

jobs:
  dividend-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dividend report
        run: python weekly_dividend.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MY_HOLDINGS: ${{ secrets.MY_HOLDINGS }}
