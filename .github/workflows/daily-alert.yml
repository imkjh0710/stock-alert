name: Daily Analysis (Stock + Dividend)

on:
  schedule:
    - cron: '30 21 * * *'   # 매일 UTC 21:30 = KST 오전 6:30
    - cron: '0 14 * * *'    # 매일 UTC 14:00 = KST 오후 11:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock analysis
        run: python main.py

      - name: Cleanup old daily cache (keep 14 days)
        run: find cache/daily -name "*.json" -mtime +14 -delete 2>/dev/null || true

      - name: Run dividend analysis
        run: python weekly_dividend.py

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/
          git diff --staged --quiet || git commit -m "chore: update daily cache [skip ci]"
          git pull --rebase origin main
          git push
