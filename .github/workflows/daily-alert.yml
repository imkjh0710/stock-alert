name: Daily Analysis (Stock + Dividend)

on:
  schedule:
    - cron: '30 21 * * *'   # KST 06:30 — 주식 + 배당 (하루 1회)
    - cron: '0 4 * * *'     # KST 13:00 — 주식만
    - cron: '0 9 * * *'     # KST 18:00 — 주식만
    - cron: '0 14 * * *'    # KST 23:00 — 주식만
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock analysis
        run: python main.py

      - name: Cleanup old daily cache (keep 14 days)
        run: find cache/daily -name "*.json" -mtime +14 -delete 2>/dev/null || true

      - name: Run dividend analysis (morning run only)
        if: ${{ github.event.schedule == '30 21 * * *' || github.event_name == 'workflow_dispatch' }}
        run: python weekly_dividend.py

      - name: Analyze holdings (morning run only)
        if: ${{ github.event.schedule == '30 21 * * *' || github.event_name == 'workflow_dispatch' }}
        run: python analyze_holdings.py || true

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/
          git diff --staged --quiet || git commit -m "chore: update daily cache [skip ci]"
          git pull --rebase origin main
          git push
