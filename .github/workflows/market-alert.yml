name: Market Alerts

on:
  schedule:
    # ── 장 오픈 +30분 (10:00 AM ET) ──────────────────────────────
    - cron: '0 14 * * 1-5'   # EDT 여름 (UTC-4): 10:00 AM ET
    - cron: '0 15 * * 1-5'   # EST 겨울 (UTC-5): 10:00 AM ET
    # ── 장 마감 (4:00 PM ET) ─────────────────────────────────────
    - cron: '0 20 * * 1-5'   # EDT 여름 (UTC-4): 4:00 PM ET
    - cron: '0 21 * * 1-5'   # EST 겨울 (UTC-5): 4:00 PM ET

  workflow_dispatch:
    inputs:
      alert_type:
        description: 'Alert type: open / close / auto'
        required: false
        default: 'auto'

jobs:
  market-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market alert
        run: python market_alert.py ${{ github.event.inputs.alert_type || 'auto' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MY_HOLDINGS: ${{ secrets.MY_HOLDINGS }}
